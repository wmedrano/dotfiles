# Environment for the systemd user session (read at login, inherited by all
# processes: shells, terminals, Emacs, GUI launchers).
#
# Make Node trust the system CA store in addition to its bundled list. Pi ships
# its own Node, so services behind a private CA (e.g. https://dumile.local, a
# Caddy instance on the LAN) otherwise fail with "Connection error."
#
# The CA is vendored at certs/dumile-local-root.crt; setup.sh adds it to the
# system trust store if missing. If Caddy regenerates its root, replace that
# file (from /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
# on dumile) and re-run setup.sh.
#
# Takes effect at next login; for the current session:
#   systemctl --user set-environment NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
